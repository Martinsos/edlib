name: CI

on:
  push:
    branches:
      - master
    tags:
      - '*'
  pull_request:
    branches:
      - master

jobs:
  cpp_edlib:
    name: "C++ (${{ matrix.os }}, ${{ matrix.cxx }})"
    strategy:
      matrix:
        include:
          # GCC on Linux and Apple Clang on ARM64 cover the regular builds.
          # Linux Clang is covered separately by the sanitizer job.
          - { os: ubuntu-24.04, cc: gcc-14, cxx: g++-14 }
          - { os: macos-15, cc: clang, cxx: clang++ }
    runs-on: ${{ matrix.os }}
    env:
      CC: ${{ matrix.cc }}
      CXX: ${{ matrix.cxx }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install system dependencies (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y valgrind

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.x'

      - name: Install Python packages
        run: |
          python -m pip install --upgrade pip setuptools meson ninja

      - name: Build binaries and libraries and test them (with Meson)
        run: |
          make CXXFLAGS="-Werror" LIBRARY_TYPE=static BUILD_DIR=meson-build-static
          make CXXFLAGS="-Werror" LIBRARY_TYPE=shared BUILD_DIR=meson-build-shared

          # Check for memory leaks.
          # I run this only on linux because osx returns errors from
          # system libraries, which I would have to supress.
          if [ ${{ runner.os }} == "Linux" ]; then
            make check-memory-leaks BUILD_DIR=meson-build-static
          fi

      - name: Build binaries and libraries and test them (with CMake)
        run: |
          mkdir -p build && cd build
          CXXFLAGS="-Werror" cmake -GNinja ..
          ninja -v
          bin/runTests

  cpp_edlib_sanitizers:
    name: "Check CPP edlib with AddressSanitizer and UndefinedBehaviorSanitizer"
    runs-on: ubuntu-24.04
    env:
      CC: clang-18
      CXX: clang++-18
      ASAN_OPTIONS: detect_leaks=1
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.x'

      - name: Install Python packages
        run: |
          python -m pip install --upgrade pip setuptools meson ninja

      - name: Test benchmark report comparisons
        run: python -m unittest discover -s benchmarks -p 'test_*.py'

      - name: Build and test with sanitizers
        run: make sanitizer

      - name: Exercise benchmark inputs with sanitizers
        env:
          UBSAN_OPTIONS: halt_on_error=1:print_stacktrace=1
        run: |
          meson compile -C build/sanitizer edlib-benchmark
          python benchmarks/run.py --binary build/sanitizer/edlib-benchmark \
            --suite smoke --samples 1 --sample-ms 1 \
            --output build/sanitizer/benchmark-smoke.json

  # TODO: I should have this step produce artifacts (wheels and sdist), but not deploy them.
  #   Then, I should have another step that deploys them, therefore not deploying unless all jobs pass,
  #   making sure we don't deploy only half of the wheels.
  python_edlib:
    name: "Build, test and possibly deploy python bindings for edlib"
    strategy:
      matrix:
        include:
          - os: ubuntu-24.04
            deploy-sdist: true
          - os: macos-15-intel
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        working-directory: bindings/python
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.x'

      - name: Install Python deps
        run: |
          python -m pip install setuptools

      - name: Build edlib python module
        run: |
          make build

      - name: Test edlib python module
        run: |
          python test.py

      - name: Build sdist
        run: |
          make sdist
          # To ensure it doesn't get cleaned up by the `make wheels` or some other step.
          mv dist sdist

      - name: Build wheels
        run: |
          if [ "${{ runner.os }}" = "macOS" ]; then
            # Default is x86-64 only, but this way we also build universal2 wheels,
            # which work on both intel (x86_64) and apple silicon (arm64).
            export CIBW_ARCHS_MACOS="x86_64 universal2"
          fi
          make wheels

      - name: Deploy sdist and Linux and Mac wheels to PyPI
        if: github.ref_type == 'tag'
        env:
          TWINE_USERNAME: __token__
          TWINE_PASSWORD: ${{ secrets.PYPI_API_TOKEN }}
        run: |
          python -m pip install twine

          python -m twine upload --skip-existing wheelhouse/*.whl

          # While I do want to upload wheels for both Mac and Linux,
          # it makes no sense to upload sdist twice.
          if [ ${{ matrix.deploy-sdist }} == "true" ]; then
            python -m twine upload --skip-existing sdist/edlib-*.tar.gz
          fi

